<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Saturn-style mark matching the loading spinner (hud accent #8eb4c4). -->
  <g transform="translate(16 16) rotate(-28)">
    <!-- Outer ring -->
    <ellipse
      cx="0"
      cy="0"
      rx="14"
      ry="5.2"
      stroke="#8eb4c4"
      stroke-width="1.6"
    />
    <!-- Inner ring -->
    <ellipse
      cx="0"
      cy="0"
      rx="10.2"
      ry="3.8"
      stroke="#c4d6e6"
      stroke-width="1.15"
      stroke-opacity="0.45"
    />
    <!-- Planet body -->
    <circle cx="0" cy="0" r="4.6" fill="#8eb4c4" />
  </g>
</svg>
