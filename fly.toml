# fly.toml app configuration file generated for sse-api on 2026-10-14T00:34:37-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "sse-api"
primary_region = "ord"

[build]
  dockerfile = "server/Dockerfile"

[env]
  KERNELS_ROOT = "/kernels"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"

[mounts]
  source = "sse_kernels"
  destination = "/kernels"